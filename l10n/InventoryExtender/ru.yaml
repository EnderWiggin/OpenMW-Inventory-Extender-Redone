ConfigTitle: Новый инвентарь - Inventory Extender Redone
ConfigSummary: |-
  Lua-замена окна инвентаря на модернизированный интерфейс на основе списков.
  --- v%{version} --- 
  Автор: TPABOBAP & Ralts
  Перевод: Sergey Rudyi
RequiresReload: "Некоторые изменения требуют перезапуска Lua для активации."
ConfigCategoryKeybinds: "Горячие клавиши"
KeybindUseItem: "Использовать предмет"
KeybindUseItemDesc: |-
  Мгновенно использовать предмет инвентаря под курсором.
KeybindToggleFavorite: "Изменить избранное"
KeybindToggleFavoriteDesc: |-
  Переключить статус избранного для предмета инвентаря под курсором.
  
  Избранные предметы нельзя продать, выбросить или переместить в другие инвентари. Они отмечены значком звезды в списке.
KeybindCatPrev: След. Категория
KeybindCatNext: Пред. Категория
KeybindSelUp: Выбор Вверх
KeybindSelDown: Выбор Вниз
KeybindSelLeft: Выбор Лево
KeybindSelRight: Выбор Право

SwapUsePickup: "Поменять местами исп./взять"
SwapUsePickupDesc: |-
  По умолчанию клавиша "Использовать предмет" использует предметы, а левый клик — берет их.
  
  Включите эту опцию, чтобы поменять поведение: левый клик будет использовать предметы, а клавиша — брать.

ConfigCategoryWindowOptions: "Настройки окна"
EnableMod: "Включить мод"
ItemViewMode: "Режим просмотра предметов"
ItemViewModeDesc: |-
  Выбор между подробным видом таблицы или классической сеткой в стиле оригинала.
ItemViewMode_Table: "Таблица"
ItemViewMode_Grid: "Сетка"
GridIconScale: Масштаб иконок Сетки
GridIconScaleDesc: |-
  Меняет размер иконок в режиме Сетки.
  Диапазон [0.2 - 5], по умолчанию 1.
ShowViewModeButton: "Показывать кнопку режима"
ShowViewModeButtonDesc: |-
  Показывать кнопку в верхней панели для переключения между таблицей и сеткой.
TableRowHeightMult: "Множитель высоты строк таблицы"
TableRowHeightMultDesc: |-
  Регулировка высоты строк в режиме таблицы как множителя размера текста.
TableScrollStep: "Шаг прокрутки таблицы"
TableScrollStepDesc: |-
  Регулировка шага прокрутки в режиме таблицы (в количестве строк).
IconPack: "Пакет иконок"
IconPackDesc: |-
  Выберите, какой пакет иконок Inventory Extender использовать.

ConfigCategoryTweaks: "Исправления"
InvertCategorySwitching: "Инвертировать переключение категорий"
InvertCategorySwitchingDesc: |-
  По умолчанию при смене категории другие окна переключаются на ту же категорию, если не удерживать Shift.
  Включите эту опцию, чтобы инвертировать поведение: другие окна будут менять категорию только при удержании Shift.
CompactCategoryFilter: "Компактный фильтр категорий"
CompactCategoryFilterDesc: |-
  Переместить кнопки категорий в верхнюю панель и показывать активную категорию в заголовке окна вместо отдельной плашки.
VanillaCategoryIcons: "Иконки категорий в ванильном стиле"
VanillaCategoryIconsDesc: |-
  Отображать кнопки категорий с классической подложкой и подсветкой на основе прозрачности.
CategoryBarBorders: "Границы панели категорий"
CategoryBarBordersDesc: |-
  Показывать границы вокруг панели категорий.
StolenIndicator: "Индикатор краденого"
StolenIndicatorDesc: |-
  Показывать иконку рядом с крадеными предметами в инвентаре.
ShowStolenInfo: "Показывать сведения о краденых предметах"
ShowStolenInfoDesc: |-
  В подсказках показывать список людей и фракций, у которых был украден предмет.
StolenTooltipText: "Украдено у:"
EnchantedIndicatorMode: "Режим индикатора зачарования"
EnchantedIndicatorModeDesc: |-
  В режиме таблицы показывать зачарованные предметы с сиянием на иконке, значком в строке имени или и тем, и другим.
  В режиме сетки всегда отображается только сияние.
EnchantedIndicatorMode_Swirl: "Сияние"
EnchantedIndicatorMode_Icon: "Иконка имени"
EnchantedIndicatorMode_Both: "И то, и другое"
FilledGemsAppearEnchanted: "Заполненные камни как зачарованные"
FilledGemsAppearEnchantedDesc: |-
  Отображать заполненные камни душ как зачарованные предметы, чтобы их было проще отличить.

ConfigCategoryModIntegration: "Интеграция модов"
InterfaceReimagined: "Поддержка Interface Reimagined"
InterfaceReimaginedDesc: |-
  Настроить внешний вид для лучшего соответствия стилю Interface Reimagined.
TooltipsComplete: "Поддержка Tooltips Complete"
TooltipsCompleteDesc: |-
  Если установлен Tooltips Complete, добавлять его описания к подсказкам предметов.

ConfigCategoryMisc: "Разное"
ShowControllerWarning: "Предупреждение о контроллере"
ShowControllerWarningDesc: |-
  Показывать предупреждение, если включено меню контроллера, так как этот инвентарь с ними несовместим.
TooltipCompatibilityMode: "Режим совместимости подсказок HUD"
TooltipCompatibilityModeDesc: |-
  Из-за ограничений API подсказки мира при наведении требуют блокировки всего экрана, что блокирует подсказки HUD (эффекты, заклинания и т.д.)
  Если режим совместимости ВКЛ, экран блокируется только при перетаскивании предмета. Это сохраняет подсказки HUD, но подсказки мира станут ванильными.

ConfigCategoryGameplay: "Игровой процесс"
SoulGemValueRebalance: "Ребаланс стоимости камней душ"
SoulGemValueRebalanceDesc: |-
  Сделать стоимость заполненных камней душ зависимой только от объема души.
IgnoreChestCapacity: "Игнорировать вместимость контейнера"
IgnoreChestCapacityDesc: |-
  Позволяет помещать предметы в контейнеры, игнорируя ограничения по весу.

